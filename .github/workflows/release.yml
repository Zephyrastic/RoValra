name: Build and Release Extension

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:

jobs:
    build-and-package:
        permissions:
            contents: write

        runs-on: ubuntu-latest

        env:
            # Step-level `if` cannot read the secrets context, so mirror the
            # Chrome Web Store secret's presence into an env flag and skip the
            # upload step on forks/clones that have no secrets configured.
            HAS_CWS: ${{ secrets.EXTENSION_ID != '' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build extension
              run: npm run build

            - name: Build Firefox extension
              run: npm run build:firefox

            - name: Lint Firefox build
              run: npm run lint:firefox

            - name: Package extension
              run: |
                  cd dist
                  zip -r ../rovalra-${{ github.ref_name }}.zip .

            - name: Package Firefox extension
              run: |
                  cd dist-firefox
                  zip -r ../rovalra-${{ github.ref_name }}-firefox.zip .

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      rovalra-${{ github.ref_name }}.zip
                      rovalra-${{ github.ref_name }}-firefox.zip
              env:
                  # ACCESS_TOKEN is optional; fall back to the workflow's own
                  # token (the job has contents: write) so releases work on
                  # repositories without that secret.
                  GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}

            - name: Upload to Chrome Web Store
              if: env.HAS_CWS == 'true'
              uses: mnao305/chrome-extension-upload@v6.0.0
              with:
                  file-path: rovalra-${{ github.ref_name }}.zip
                  extension-id: ${{ secrets.EXTENSION_ID }}
                  client-id: ${{ secrets.CLIENT_ID }}
                  client-secret: ${{ secrets.CLIENT_SECRET }}
                  refresh-token: ${{ secrets.REFRESH_TOKEN }}
