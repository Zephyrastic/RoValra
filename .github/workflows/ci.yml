name: CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build extension
              run: npm run build

            - name: Build Firefox extension
              run: npm run build:firefox

            # web-ext lint is the gate that matters here; the ESLint config
            # still carries a large pre-existing error backlog from upstream
            # and would redden every push until it is fully cleaned up.
            - name: Lint Firefox build
              run: npm run lint:firefox
